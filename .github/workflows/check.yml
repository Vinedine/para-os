# Runs the repo's contract checks and every test suite on each pull request and push to main.
# --no-vendor skips `claude plugin validate`, which needs the Claude CLI and an account; run
# tools/check.py without it before shipping a revision.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # /para-upgrade's tests read git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install requests (outlook's CLI tests run the script itself)
        run: python3 -m pip install requests
      - name: Contract checks and test suites
        run: python3 tools/check.py --no-vendor
