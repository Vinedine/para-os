# Runs the repo's contract checks and every test suite on each pull request, on pushes to main,
# stable and feat/ branches, and on demand from the Actions tab. --no-vendor skips `claude plugin
# validate`, which needs the Claude CLI and an account; run tools/check.py without it before
# shipping a revision.
name: check

on:
  pull_request:
  push:
    branches: [main, stable, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python }})
    # All three: the README promises Windows or macOS, and CI is the only place a change made
    # on one of them is run on the others. Python 3.9 is the oldest the scripts support.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # /para-upgrade's tests read git history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `python`, not `python3`: setup-python provides that name on every runner, Windows too.
      - name: Install requests (outlook's CLI tests run the script itself)
        run: python -m pip install requests
      - name: Contract checks and test suites
        run: python tools/check.py --no-vendor
      # check.py reads the PowerShell scripts as text only. Parsing them with PowerShell's own
      # parser catches a script that would not even load; pwsh ships on every hosted runner.
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 -Path addons, integrations, base) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object { "$($f.FullName):$($_.Extent.StartLineNumber): $($_.Message)" }
            } else { "ok $($f.FullName)" }
          }
          if ($failed) { exit 1 }

  coverage:
    # One platform is enough to measure: the suites are the same everywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install coverage.py and requests
        run: python -m pip install "coverage>=7.10" requests
      # The floors sit just under what the suites reach today, so a drop fails the job.
      # Raise them when coverage rises; the report lands on the run's summary page.
      - name: Coverage
        run: python tools/coverage_report.py --fail-under 97 --fail-under-js 95 --summary "$GITHUB_STEP_SUMMARY"
