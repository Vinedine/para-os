# Starts Claude Code from a comment containing `@claude` on an issue or pull request, typically
# `@claude work this issue` on an `agent-ready` issue. The run follows the repository's CLAUDE.md
# (one branch per issue, a pull request into main that says `Fixes #N`); this file adds no
# instructions of its own. The action's defaults decide who can trigger it: people with write
# access, never bots, so a stranger's comment cannot spend the subscription.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot'
    # Two comments on one issue queue behind each other instead of starting two runs. At job
    # level, not workflow level, so a run the `if:` skips finishes at once instead of queueing.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The agent reads the whole thread, and anyone can comment on a public repository, so a
      # stranger's words would reach its prompt. Refuse the run unless every issue, pull request,
      # comment and review on the thread is by the owner or one of the two bots below. A
      # collaborator added later is trusted by adding their login to TRUSTED.
      - name: Refuse a thread with outside authors
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
          TRUSTED: ${{ github.repository_owner }} claude[bot] github-actions[bot]
        run: |
          authors() {
            gh api "repos/$REPO/issues/$NUMBER" --jq '.user.login' || return 1
            gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[].user.login' || return 1
            if [ "$IS_PR" = true ]; then
              gh api --paginate "repos/$REPO/pulls/$NUMBER/comments" --jq '.[].user.login' || return 1
              gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" --jq '.[].user.login' || return 1
            fi
          }
          list=$(authors) || { echo "::error::Could not list the thread's authors"; exit 1; }
          outside=""
          for login in $(echo "$list" | sort -u); do
            case " $TRUSTED " in
              *" $login "*) ;;
              *) outside="$outside $login" ;;
            esac
          done
          if [ -n "$outside" ]; then
            echo "::error::Not run: this thread has text by$outside. Remove it, or trust the author in claude.yml."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # /para-upgrade's tests read git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CLAUDE.md requires tools/check.py before every commit; outlook's tests need requests.
      - name: Install requests
        run: python3 -m pip install requests
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash(python3 tools/check.py:*)"
