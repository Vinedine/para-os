# Runs the eval suite on a model, weekly and on demand from the Actions tab, never on a push or
# a pull request: every run is a real model call on the maintainer's Claude subscription. It
# reports and never gates on a score. evals/README.md#in-ci has what a red run means.
name: evals

on:
  schedule:
    - cron: "0 20 * * 5"  # Fridays, 20:00 UTC
  workflow_dispatch:
    inputs:
      case:
        description: "Case name glob, such as triage-*; empty runs every case"
        required: false
        default: ""
      model:
        description: "Model the cases run on, such as haiku; empty runs the default"
        required: false
        default: ""

permissions:
  contents: read

# One run at a time: two would share the plan's rate limit and score each other's throttling.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Unpinned, so the evals measure the CLI users run; the summary names it, so a score that
      # moved with a CLI release reads apart from one that moved with the repo.
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          version=$(claude --version)
          echo "Claude Code $version" | tee -a "$GITHUB_STEP_SUMMARY"
      # A granted shell runs inside bubblewrap, and Claude Code's seccomp helper inside that. Ubuntu
      # 24.04's AppArmor stops both using user namespaces, so this throwaway runner lifts the limit.
      - name: Install the sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -e -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / true
      # --threshold 0: a low score never fails the job. --keep-temp keeps the traces the summary
      # reads the model from. TMPDIR keeps case folders off /tmp, which the shell cannot write.
      - name: Evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PARAOS_HOME: ${{ runner.temp }}/paraos
          TMPDIR: ${{ runner.temp }}
          CASE: ${{ inputs.case }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN secret: run claude setup-token and add it"
            exit 1
          fi
          args=(--shell --summary "$GITHUB_STEP_SUMMARY")
          if [ -n "$CASE" ]; then args+=(--case "$CASE"); fi
          vendor=(--runs 1 --threshold 0 --concurrency 4 --max-cost-usd 40 --keep-temp)
          if [ -n "$MODEL" ]; then vendor+=(--model "$MODEL"); fi
          python tools/eval.py "${args[@]}" -- "${vendor[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: ${{ runner.temp }}/paraos/data/eval-runs/
          if-no-files-found: warn
